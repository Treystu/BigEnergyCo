name: Verify staging

# The gate between main and production: it verifies the artifact that is
# actually DEPLOYED on staging — stamp, byte parity for every deployed file,
# platform surface rules and a real-browser smoke against that URL — instead of
# a localhost copy. `scripts/promote.mjs` runs this same verifier and refuses to
# deploy unless it passes, so a green run here is the evidence a release rests
# on.
on:
  # Fires for the Pages deploy of a push to main. Pages propagates in ~30-60s,
  # so the verifier waits for the expected stamp (--wait) rather than racing it.
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base:
        description: Staging base URL to verify (falls back to the STAGING_BASE repository variable)
        required: false
        default: ""

concurrency:
  group: verify-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # workflow_run fires for failed deploys too — there is nothing to verify then.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Must stay above the verifier's own total budget plus startup slack, or a
    # slow failure would be killed here instead of returning a verdict.
    # scripts/lib/budgets.mjs owns both numbers; a test pins them together.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The origin is not hard-coded. Its former default
      # (the old org's GitHub Pages URL) answers HTTP 404 since the repository
      # moved (read 2026-11-13), so this gate was reporting staging failures
      # about a host that serves nothing (#361). Naming the origin is an owner
      # decision, so the job refuses by name until one is set.
      - name: Require a named staging origin
        run: |
          base="${{ github.event.inputs.base || vars.STAGING_BASE }}"
          if [ -z "$base" ]; then
            echo "::error::No staging origin named. Set the STAGING_BASE repository variable (Settings > Secrets and variables > Actions > Variables) or pass the base input. The retired default answers HTTP 404; see issue #361."
            exit 1
          fi
          echo "STAGING_BASE=$base" >> "$GITHUB_ENV"

      # Chrome ships on the runner (same assumption as the web-smoke job), so the
      # functional half of the verification runs here too.
      - name: Verify the deployed staging artifact
        run: |
          node scripts/verify-staging.mjs \
            --base "$STAGING_BASE" \
            --wait 240

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-verification
          path: |
            _pages_smoke/
            *.png
          if-no-files-found: ignore
          retention-days: 7
