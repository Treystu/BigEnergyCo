name: Verify staging

# The gate between main and production: it verifies the artifact that is
# actually DEPLOYED on staging — stamp, byte parity for every deployed file,
# platform surface rules and a real-browser smoke against that URL — instead of
# a localhost copy. `scripts/promote.mjs` runs this same verifier and refuses to
# deploy unless it passes, so a green run here is the evidence a release rests
# on.
on:
  # Fires for the Pages deploy of a push to main. Pages propagates in ~30-60s,
  # so the verifier waits for the expected stamp (--wait) rather than racing it.
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base:
        # No default on purpose. The old default was the retired org origin, which
        # answers 404, so this gate failed for a reason unrelated to the artifact
        # under test. Which origin is authoritative is an owner call - #361.
        description: Staging base URL to verify (required - no default)
        required: false

concurrency:
  group: verify-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # workflow_run fires for failed deploys too — there is nothing to verify then.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Must stay above the verifier's own total budget plus startup slack, or a
    # slow failure would be killed here instead of returning a verdict.
    # scripts/lib/budgets.mjs owns both numbers; a test pins them together.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Chrome ships on the runner (same assumption as the web-smoke job), so the
      # functional half of the verification runs here too.
      - name: Verify the deployed staging artifact
        run: |
          # A dispatch names its origin. A workflow_run has a derivable one: this
          # job fires on the GitHub Pages deploy, so the artifact it produced is
          # that repository's Pages origin - a derivation from the trigger, not
          # an assumption. Both replace the retired default that answered 404,
          # which made this gate fail for a reason unrelated to the artifact.
          node scripts/verify-staging.mjs \
            --base "${{ github.event.inputs.base || format('https://{0}.github.io/BigEnergyCo/', github.repository_owner) }}" \
            --wait 240

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-verification
          path: |
            _pages_smoke/
            *.png
          if-no-files-found: ignore
          retention-days: 7
